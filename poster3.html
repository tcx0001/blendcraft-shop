<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BlendCraft — price</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif}
.poster{width:1080px;height:1080px;background:#f8fafc;display:flex;flex-direction:column;padding:44px 52px}
.brand{display:flex;align-items:center;gap:12px;font-family:Poppins;font-weight:700;font-size:27px;color:#0b1220}
.brand .dot{width:15px;height:15px;background:linear-gradient(135deg,#0d9488,#0f766e);border-radius:4px;transform:rotate(45deg)}
h1{font-family:Poppins;font-weight:800;font-size:74px;line-height:1.0;letter-spacing:-2px;color:#0b1220;margin-top:22px}
h1 .accent{color:#0f766e}
.sub{font-size:24px;color:#475569;margin-top:16px;max-width:900px;line-height:1.3;font-weight:500}
.card{margin-top:24px;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 20px 50px rgba(15,23,42,.1);border:1px solid #e2e8f0}
.card img{width:100%;height:344px;object-fit:cover;display:block}
.compare{margin-top:22px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px 28px}
.cmp{display:flex;align-items:center;gap:14px;padding:9px 0;font-size:23px;font-weight:600;color:#334155}
.cmp .lab{width:230px;display:flex;align-items:center;gap:10px}
.cmp .bar{flex:1;border-radius:99px;height:20px}
.cmp.oem .bar{background:#cbd5e1;width:100%}
.cmp.us .bar{background:linear-gradient(90deg,#0d9488,#f97316);width:46%}
.cmp .val{font-family:Poppins;font-weight:800;font-size:24px}
.cmp.oem .val{color:#94a3b8}.cmp.us .val{color:#0f766e}
.cta{margin-top:auto;background:linear-gradient(135deg,#0d9488,#0f766e);border-radius:20px;padding:24px 30px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 18px 40px rgba(15,118,110,.3)}
.cta .big{font-family:Poppins;font-weight:800;font-size:33px;color:#fff}
.cta .sm{font-size:20px;font-weight:600;color:#fff;opacity:.98;text-align:right;line-height:1.2}
</style>
</head>
<body>
<div class="poster">
  <div class="brand"><span class="dot"></span>BlendCraft</div>
  <h1>OEM price?<br><span class="accent">No thanks.</span></h1>
  <div class="sub">Exact-fit compatible blades, cups &amp; parts for Vitamix, NutriBullet and Ninja — quality you can trust, for far less.</div>
  <div class="card"><picture><source srcset="images/vm_wet_blade.webp" type="image/webp"><img src="images/vm_wet_blade.jpg" alt="Compatible blade"></picture></div>
  <div class="compare">
    <div class="cmp oem"><span class="lab">OEM price</span><span class="bar"></span></div>
    <div class="cmp us"><span class="lab">BlendCraft</span><span class="bar"></span></div>
  </div>
  <div class="cta"><span class="big">Shop Compatible Parts</span><span class="sm">free shipping over $50<br>blendcraft · 30-day guarantee</span></div>
</div>
</body>
</html>

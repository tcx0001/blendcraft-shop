<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Compatible Blender Parts — BlendCraft</title>
<meta name="description" content="Shop high-quality compatible replacement blades, cups, lids, containers and parts for Vitamix, NutriBullet and Ninja blenders.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <h1>Shop All Parts</h1>
    <p>Exact-fit compatible replacements for Vitamix, NutriBullet and Ninja blenders.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid" data-filter="All"></div>
  </div>
</section>

<footer id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  const fc = el('#filters'); if(fc){
    fc.innerHTML = CATEGORIES.map(c=>`<button class="filter${c==='All'?' active':''}" data-filter="${c}">${c}</button>`).join('');
    fc.addEventListener('click', e=>{
      const b = e.target.closest('.filter'); if(!b) return;
      const f = b.dataset.filter;
      els('.filter').forEach(x=>x.classList.remove('active')); b.classList.add('active');
      window.renderGrid(f,'');
      // keep URL-ish state
      fc.dataset.current = f;
    });
  }
})();
</script>
</body>
</html>

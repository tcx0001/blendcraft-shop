<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse All Compatible Parts — BlendCraft</title>
<meta name="description" content="High-quality compatible replacement parts for Vitamix, NutriBullet and Ninja. Exact-fit blades, cups and containers at a fraction of OEM cost.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <h1 id="shop-title">Browse All Compatible Parts</h1>
    <p id="shop-lead">High-quality compatible replacement parts for the blenders you already own. Exact-fit blades, cups and containers for Vitamix, NutriBullet and Ninja.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="filters" id="brand-filters"></div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid" data-filter="All"></div>
  </div>
</section>

<footer id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  let brand = params.get('brand') || '';
  const intro = BRAND_INTROS[brand] || BRAND_INTROS.All;
  const titleEl = el('#shop-title');
  const leadEl = el('#shop-lead');
  if(titleEl) titleEl.textContent = intro.title;
  if(leadEl) leadEl.textContent = intro.text;
  document.title = intro.title + ' — BlendCraft';

  const brands = ['All', 'NutriBullet', 'Vitamix', 'Ninja'];
  const bf = el('#brand-filters');
  if(bf){
    bf.innerHTML = brands.map(b=>{
      const active = (b==='All' && !brand) || b===brand;
      return `<button class="filter${active?' active':''}" data-brand="${b==='All'?'':b}">${b==='All'?'All Brands':b}</button>`;
    }).join('');
    bf.addEventListener('click', e=>{
      const b = e.target.closest('.filter'); if(!b) return;
      brand = b.dataset.brand || '';
      els('#brand-filters .filter').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const info = BRAND_INTROS[brand] || BRAND_INTROS.All;
      if(titleEl) titleEl.textContent = info.title;
      if(leadEl) leadEl.textContent = info.text;
      const cat = (el('#filters')||{}).dataset.current || 'All';
      window.renderGrid(cat, '', brand);
      const url = brand ? 'shop.html?brand='+encodeURIComponent(brand) : 'shop.html';
      history.replaceState(null, '', url);
      if(window.updateShopCrumbs) window.updateShopCrumbs(brand);
    });
  }

  const fc = el('#filters'); if(fc){
    fc.innerHTML = CATEGORIES.map(c=>`<button class="filter${c==='All'?' active':''}" data-filter="${c}">${c}</button>`).join('');
    fc.dataset.current = 'All';
    fc.addEventListener('click', e=>{
      const b = e.target.closest('.filter'); if(!b) return;
      const f = b.dataset.filter;
      els('#filters .filter').forEach(x=>x.classList.remove('active')); b.classList.add('active');
      fc.dataset.current = f;
      window.renderGrid(f, '', brand);
    });
  }

  window.renderGrid('All', '', brand);
})();
</script>
</body>
</html>
